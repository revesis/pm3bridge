plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pm3.bridge'
    compileSdk 34

    defaultConfig {
        applicationId 'com.pm3.bridge'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    // The prebuilt usbwire .so lives in src/main/jniLibs/arm64-v8a/ and is
    // loaded via System.loadLibrary; AGP packages it as-is.
}
